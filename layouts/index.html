{{ define "main" }}
  <div class="hx:mx-auto hx:flex hextra-max-page-width">
    <article class="hx:w-full hx:break-words hx:flex hx:min-h-[calc(100vh-var(--hextra-navbar-height))] hx:min-w-0 hx:justify-center hx:pb-8 hx:pr-[calc(env(safe-area-inset-right)-1.5rem)]">
      <main class="hx:w-full hx:min-w-0 hextra-max-content-width hx:px-6 hx:pt-4 hx:md:px-12">
        {{ .Content }}
        {{- $pages := where .Site.RegularPages "Section" "posts" -}}
        {{- $pages = sort $pages "Date" "desc" -}}
        {{- range $pages }}
          <div class="hx:mb-10">
            <h3><a style="color: inherit; text-decoration: none;" class="hx:block hx:font-semibold hx:mt-8 hx:text-2xl " href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            <p class="hx:opacity-50 hx:text-sm hx:mt-2 hx:leading-7">{{ .Date.Format "02/01/2006" }}</p>
            <p class="hx:opacity-80 hx:mt-4 hx:leading-7">{{ .Description }}</p>
            <p class="hx:opacity-80 hx:mt-1 hx:leading-7">
              <a class="hx:text-[color:hsl(var(--primary-hue),100%,50%)] hx:underline hx:underline-offset-2 hx:decoration-from-font" href="{{ .RelPermalink }}">Ler mais →</a>
            </p>
          </div>
        {{ end -}}
      </main>
    </article>
    <div class="hx:max-xl:hidden hx:h-0 hx:w-64 hx:shrink-0"></div>
  </div>
{{- end -}}
